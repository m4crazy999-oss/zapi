name: zapi
description: "Zapi — Mensageiro moderno em tempo real para Android."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^14.6.2
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_database: ^11.3.4
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  flutter_image_compress: ^2.4.0
  permission_handler: ^11.4.0
  record: ^6.1.2
  just_audio: ^0.10.2
  audio_session: ^0.2.1
  gal: ^2.3.1
  image: ^4.5.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/icon/
    - assets/splash/
    - assets/stickers/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#00A884"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#F7F9F8"
  image: "assets/splash/splash_logo.png"
  color_dark: "#0B141A"
  image_dark: "assets/splash/splash_logo_dark.png"
  android_12:
    color: "#F7F9F8"
    image: "assets/splash/android12_splash_icon.png"
    icon_background_color: "#F7F9F8"
    color_dark: "#0B141A"
    image_dark: "assets/splash/android12_splash_icon_dark.png"
    icon_background_color_dark: "#0B141A"
  fullscreen: true
