name: Build Zapi Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-release:
    name: Build APK Release Assinado
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configurar Flutter estável (versão fixa testada)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.38.10"
          cache: true

      - name: Verificar versões do Flutter e Java
        run: |
          flutter --version
          java -version

      - name: Validar presença dos Secrets obrigatórios
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 não configurado no GitHub."
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "::error::Secrets de assinatura (ANDROID_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD) não estão completos."
            exit 1
          fi

      - name: Decodificar google-services.json a partir do Secret Base64
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '\n\r ' | base64 --decode > android/app/google-services.json

      - name: Decodificar Keystore e gerar key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\n\r ' | base64 --decode > android/app/zapi-release.jks
          printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=zapi-release.jks\n" \
            "${{ secrets.KEYSTORE_PASSWORD }}" \
            "${{ secrets.KEY_PASSWORD }}" \
            "${{ secrets.KEY_ALIAS }}" > android/key.properties

      - name: Garantir wrapper Gradle e assets de branding/figurinhas
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            rm -rf /tmp/zapi_bootstrap
            flutter create /tmp/zapi_bootstrap --platforms=android --org com.zapi --project-name zapi
            mkdir -p android/gradle/wrapper
            cp /tmp/zapi_bootstrap/android/gradlew android/gradlew
            cp /tmp/zapi_bootstrap/android/gradlew.bat android/gradlew.bat
            cp /tmp/zapi_bootstrap/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            rm -rf /tmp/zapi_bootstrap
          fi
          chmod +x android/gradlew
          python3 scripts/generate_branding_assets.py
          python3 scripts/generate_stickers.py

      - name: Instalar dependências Dart/Flutter
        run: flutter pub get

      - name: Gerar ícones adaptativos e splash screen nativa
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analisar código Dart
        run: flutter analyze

      - name: Compilar APK Release com versionamento automático
        run: |
          if [ -f android/gradlew ]; then chmod +x android/gradlew; fi
          VERSION_NAME="1.0.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/zapi-v${VERSION_NAME}.apk"

      - name: Publicar APK como Artifact da execução
        uses: actions/upload-artifact@v4
        with:
          name: zapi-release-apk-v1.0.${{ github.run_number }}
          path: build/app/outputs/flutter-apk/zapi-v1.0.${{ github.run_number }}.apk
          retention-days: 30

      - name: Publicar APK como GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Zapi v1.0.${{ github.run_number }}
          body: |
            Build automático gerado a partir da branch `main`.
            - Versão: `1.0.${{ github.run_number }}` (Build `${{ github.run_number }}`)
            - Assinado com keystore de produção via GitHub Secrets.
          files: build/app/outputs/flutter-apk/zapi-v1.0.${{ github.run_number }}.apk
          draft: false
          prerelease: false

      - name: Limpar arquivos sensíveis temporários
        if: always()
        run: |
          rm -f android/app/google-services.json
          rm -f android/app/zapi-release.jks
          rm -f android/key.properties
